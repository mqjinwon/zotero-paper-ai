# Dependabot: keep main stable.
# - Safe non-majors are grouped.
# - High-risk packages (runtime API / CSS breaking) open as individual PRs only.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Dev tooling + low-risk patch/minor only (no runtime API breakers).
      safe-non-major:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          # Import path / API breakers — upgrade only with code changes + verify
          - "zotero-plugin-toolkit"
          - "zotero-plugin-scaffold"
          - "zotero-types"
          # CSS class prefix / render breaking minors (e.g. 0.16 → 0.18)
          - "katex"
    ignore:
      # Major bumps break peers / require deliberate upgrades
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "marked"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@zotero-plugin/eslint-config"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zotero-plugin-scaffold"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zotero-types"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zotero-plugin-toolkit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "katex"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
